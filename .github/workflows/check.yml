name: Check React Mindmap
on:
  push:
    branches: [main, feat/react-rewrite]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: react-mindmap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        anki-version: ['25.9.2', '26.9.3']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install tools
        run: |
          python -m pip install "anki==${{ matrix.anki-version }}"
          npm ci
          npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run build
      - run: python scripts/build_react_package.py
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: matrix.anki-version == '26.9.3'
        with:
          name: anki-mindmap-react-test
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-${{ matrix.anki-version }}
          path: |
            build/*-results.json
            build/*.log
          retention-days: 14
