<script>
// Preferences are optional: retain an in-memory value even when storage is denied or full.
(function () {
    var memory = window.ankiMindmapMemory || (window.ankiMindmapMemory = Object.create(null));
    var volatileKeys = window.ankiMindmapVolatileKeys || (window.ankiMindmapVolatileKeys = new Set());
    function read(key) {
        if (volatileKeys.has(key)) return memory[key];
        try {
            var raw = localStorage.getItem(key);
            return memory[key] = raw === null ? undefined : JSON.parse(raw);
        } catch (e) { return memory[key]; }
    }
    function write(key, value) {
        memory[key] = value;
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { volatileKeys.add(key); }
    }
    window.ankiStorage = {
        setConfig: function (key, value) { write('anki_cfg_' + key, value); },
        getConfig: function (key) { return read('anki_cfg_' + key); }
    };
    // Validate stored shapes before using them; keep the existing deck preference format.
    var saved = read('decksBulletStates');
    var decks = Object.create(null);
    if (saved && typeof saved === 'object' && !Array.isArray(saved)) {
        Object.keys(saved).forEach(function (deck) {
            var states = saved[deck];
            if (!states || typeof states !== 'object' || Array.isArray(states)) return;
            decks[deck] = Object.create(null);
            Object.keys(states).forEach(function (index) {
                if (/^\d+$/.test(index) && typeof states[index] === 'boolean') decks[deck][index] = states[index];
            });
        });
    }
    window.saveState = function (index, expanded) {
        var label = document.querySelector('.floating');
        if (!label) return;
        var deck = label.textContent.trim();
        if (!decks[deck]) decks[deck] = Object.create(null);
        decks[deck][index] = expanded;
        write('decksBulletStates', decks);
    };
    window.loadState = function (index) {
        var label = document.querySelector('.floating');
        var states = label && decks[label.textContent.trim()];
        return !!(states && states[index] === true);
    };
    var theme = window.ankiStorage.getConfig('cardTheme');
    document.documentElement.classList.remove('theme-xiangya', 'theme-zhulu');
    document.documentElement.classList.add(theme === '2' ? 'theme-zhulu' : 'theme-xiangya');
})();
</script>
