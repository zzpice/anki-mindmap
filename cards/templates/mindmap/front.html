    function optimizeClozeElements(element) {
    if (!element) {
        element = document.body;
    }

    let i = 0;
    while (i < element.children.length) {
        const child = element.children[i];

        optimizeClozeElements(child);

        if (child.tagName && child.tagName.toLowerCase() === 'cloze2') {
            const cloze2_w = child.querySelector('cloze2_w');
            const innerCloze2 = child.querySelector('cloze2:not(cloze2_w)');

            if (cloze2_w && innerCloze2) {
                element.insertBefore(cloze2_w, child);
                element.insertBefore(innerCloze2, child);

                while (child.firstChild) {
                    element.insertBefore(child.firstChild, child);
                }

                child.remove();
                continue;
            }
        }

        if (
            child.tagName &&
            child.tagName.toLowerCase() === 'cloze2_w' &&
            i > 0
        ) {
            const prevSibling = element.children[i - 1];
            if (
                prevSibling.tagName &&
                prevSibling.tagName.toLowerCase() === 'cloze2_w' &&
                prevSibling.className === child.className
            ) {
                child.remove();
                continue;
            }
        }

        i++;
    }
    }

    function fixMalformedClozes() {
        const clozeSpans = document.querySelectorAll('span.cloze');
        const VALID_ATTRIBUTES = ['class', 'data-cloze', 'data-ordinal', 'style', 'id'];

        clozeSpans.forEach(span => {
            const attrs = Array.from(span.attributes);
            const classesToAdd = [];
            const attrsToRemove = [];
            let hasMalformedAttrs = false;

            attrs.forEach(attr => {
                if (!VALID_ATTRIBUTES.includes(attr.name)) {
                    hasMalformedAttrs = true;
                    const className = attr.name.replace(/[^a-zA-Z0-9-]/g, '');
                    if (className) {
                        classesToAdd.push(className);
                    }
                    attrsToRemove.push(attr.name);
                }
            });

            let trailingHTML = '';
            let ordinalValue = null;
            let hasTrailingContent = false;
            const nodesToRemove = [];
            let currentNode = span.nextSibling;

            while (currentNode) {
                let foundOrdinal = false;
                if (currentNode.nodeType === Node.TEXT_NODE) {
                    const nodeValue = currentNode.nodeValue;
                    const match = nodeValue.match(/(.*?)("?\s*data-ordinal="(\d+)")/);

                    if (match) {
                        trailingHTML += match[1];
                        ordinalValue = match[3];
                        foundOrdinal = true;
                    } else {
                        trailingHTML += nodeValue;
                    }
                } else if (currentNode.nodeType === Node.ELEMENT_NODE) {
                    trailingHTML += currentNode.outerHTML;
                }

                nodesToRemove.push(currentNode);

                if (foundOrdinal) {
                    hasTrailingContent = true;
                    break;
                }

                currentNode = currentNode.nextSibling;
            }

            if (!hasMalformedAttrs && !hasTrailingContent) {
                return;
            }

            let finalClozeContent = span.innerHTML;
            if (classesToAdd.length > 0) {
                finalClozeContent = `<span class="${classesToAdd.join(' ')}">${finalClozeContent}</span>`;
            }
            finalClozeContent += trailingHTML;

            if (ordinalValue) {
                span.setAttribute('data-ordinal', ordinalValue);
            }

            const dataCloze = span.getAttribute('data-cloze');
            if (dataCloze) {
                const tempContainer = document.createElement('div');
                tempContainer.innerHTML = dataCloze;

                const cloze2 = tempContainer.querySelector('cloze2');
                if (cloze2) {
                    cloze2.innerHTML += finalClozeContent;
                    span.setAttribute('data-cloze', tempContainer.innerHTML);
                }
            }

            attrsToRemove.forEach(attrName => {
                span.removeAttribute(attrName);
            });

            nodesToRemove.forEach(node => {
                if (node.parentNode) {
                    node.parentNode.removeChild(node);
                }
            });
        });
    }

    fixMalformedClozes();
    </script>

      }
    }, interval);
    }

    } else {
    setTimeout(tryScrollWithRetries, 1);
    }

          function setupFloatingWidget(floatingWidgetId, popupId) {
              var floatingWidget = document.getElementById(floatingWidgetId);
              var popup = document.getElementById(popupId);
              floatingWidget.onclick = function() {
                  popup.style.display = (popup.style.display === 'none' || popup.style.display === '') ? 'block' : 'none';
                  if (popup.style.display === 'block') {

          setupFloatingWidget('floating-widget', 'popup');
          setupFloatingWidget('left-floating-widget', 'popup2');

          /* ── 初始化 .cloze：写入 [...] 并叠加毛玻璃遮罩 ── */
          document.querySelectorAll('.cloze').forEach(function(span) {
              var prompt = span.innerHTML;
              span.innerHTML = '<span class="cloze-placeholder"></span>';
              span.firstElementChild.innerHTML = prompt;

              /* 创建毛玻璃遮罩层，绝对定位覆盖在 [...] 上 */
              var frosted = document.createElement('span');
              frosted.className = 'cloze-frosted';
              span.appendChild(frosted);
          });

          function removeDataOrdinalStrings() {
              const regex = /(" data-ordinal="\d{1,5}">)[^<]*/g;
              function traverseNodes(node) {
                  if (node.nodeType === Node.TEXT_NODE) {
                      const match = node.nodeValue.match(regex);
                      if (match) {
                          let prev = node.previousSibling;
                          while (prev !== null) {
                              const prevSibling = prev.previousSibling;
                              if (prev.nodeType === Node.ELEMENT_NODE) {
                                  if (prev.nodeName === 'SPAN' && prev.classList.contains('cloze')) {
                                      break;
                                  } else {
                                      prev.parentNode.removeChild(prev);
                                  }
                              } else if (prev.nodeType === Node.TEXT_NODE) {
                                  prev.parentNode.removeChild(prev);
                              } else {
                                  break;
                              }
                              prev = prevSibling;
                          }
                          node.parentNode.removeChild(node);
                      }
                  } else {
                      let child = node.firstChild;
                      while (child) {
                          const next = child.nextSibling;
                          traverseNodes(child);
                          child = next;
                      }
                  }
              }
              traverseNodes(document.body);
          }

          removeDataOrdinalStrings();
        </script>
    <script>

    function fixImageSrcInDataCloze() {
        const elements = document.querySelectorAll('[data-cloze]');

        elements.forEach(el => {
            const dataCloze = el.getAttribute('data-cloze');
            if (!dataCloze) return;

            const tempContainer = document.createElement('div');
            tempContainer.innerHTML = dataCloze;

            const images = tempContainer.querySelectorAll('img');
            let hasBeenModified = false;

            images.forEach(img => {
                const originalSrc = img.getAttribute('src');
                if (!originalSrc) return;

                let newSrc = originalSrc.replace(/&quot;/g, '');
                if (newSrc.startsWith('"')) {
                    newSrc = newSrc.substring(1);
                }
                if (newSrc.endsWith('"')) {
                    newSrc = newSrc.slice(0, -1);
                }

                if (newSrc !== originalSrc) {
                    img.setAttribute('src', newSrc);
                    hasBeenModified = true;
                }
            });

            if (hasBeenModified) {
                el.setAttribute('data-cloze', tempContainer.innerHTML);
            }
        });
    }

    fixImageSrcInDataCloze();
    </script>

    function fixOrphanedSemantics() {
        const elements = document.querySelectorAll('[data-cloze]');
        elements.forEach(el => {
            const dataCloze = el.getAttribute('data-cloze');
            if (!dataCloze) return;

            const tempContainer = document.createElement('div');
            tempContainer.innerHTML = dataCloze.replace(/&amp;/g, '&');

            let modified = false;

            const semanticsTags = tempContainer.querySelectorAll('semantics');

            semanticsTags.forEach(semantics => {
                if (!semantics.parentElement || semantics.parentElement.tagName.toLowerCase() !== 'math') {
                    const mathEl = document.createElement('math');
                    mathEl.setAttribute('xmlns', 'http://www.w3.org/1998/Math/MathML');
                    semantics.parentNode.insertBefore(mathEl, semantics);
                    mathEl.appendChild(semantics);
                    modified = true;
                }
            });

            if (modified) {
                el.setAttribute('data-cloze', tempContainer.innerHTML);
            }
        });
    }

    fixOrphanedSemantics();
    </script>
    <script>

    function cleanupDataClozeStrings() {
        const elements = document.querySelectorAll('[data-cloze]');

        elements.forEach(el => {
            let dataCloze = el.getAttribute('data-cloze');
            if (!dataCloze) return;

            let originalDataCloze = dataCloze;

            dataCloze = dataCloze.replace(/"\s*data-ordinal="\d+"&gt;\[\.\.\.\]/g, '');
            dataCloze = dataCloze.replace(/&gt;\[\.\.\.\]/g, '');

            if (dataCloze !== originalDataCloze) {
                el.setAttribute('data-cloze', dataCloze);
            }
        });
    }

    cleanupDataClozeStrings();
    </script>
    <script>

      function setupTooltipImageHover(tooltip) {
        const images = tooltip.querySelectorAll('img');

        images.forEach(img => {
          let isEnlarged = false;

          img.addEventListener('mouseenter', function() {
            if (tooltip.style.display === 'block') {
              tooltip.classList.add('enlarged');
              isEnlarged = true;
            }
          });

          img.addEventListener('mouseleave', function() {
            tooltip.classList.remove('enlarged');
            isEnlarged = false;
          });

          img.onclick = function(e) {
            isEnlarged = !isEnlarged;
            if (isEnlarged) {
              img.classList.add('enlarged');
            } else {
              img.classList.remove('enlarged');
            }
            e.preventDefault();
            e.stopPropagation();
          };

          let longPressTimer;

          img.addEventListener('touchstart', function(e) {
            longPressTimer = setTimeout(function() {
              if (!isEnlarged) {
                img.classList.add('enlarged');
                isEnlarged = true;
              }
            }, 500);
          });

          img.addEventListener('touchend', function(e) {
            clearTimeout(longPressTimer);
          });

          img.addEventListener('touchmove', function(e) {
            clearTimeout(longPressTimer);
          });

          const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
              if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                if (tooltip.style.display === 'none') {
                  isEnlarged = false;
                }
              }
            });
          });

          observer.observe(tooltip, {
            attributes: true,
            attributeFilter: ['style']
          });
        });
      }

    <script>
    /*
     * ╔══════════════════════════════════════════════════════════════╗
     * ║              快捷键 & 手柄支持（正面）                       ║
     * ╠══════════════════════════════════════════════════════════════╣
     * ║ 键盘快捷键（避开 Anki 内置：Space/Enter/1-7/E/R/A/B/S/T/Y/V）║
     * ║   G        → 笔记   弹出填写笔记浮窗（左侧顶部按钮）          ║
     * ║   H        → 定位   滚动到当前挖空（左侧底部按钮）            ║
     * ║   J        → 导图   弹出导图浮窗（右侧顶部按钮）              ║
     * ║   K        → 伸/缩  展开或折叠所有节点（右侧中部按钮）        ║
     * ║   L        → 显/隐  cloze 答案（右侧底部按钮）               ║
     * ║   C        → 色系   切换象牙笺 / 竹露主题                    ║
     * ║   Ctrl+F   → 搜索   打开搜索面板并聚焦输入框                 ║
     * ║   Escape   → 关闭   关闭搜索面板                            ║
     * ║   】       → 揭示   揭示下一个挖空                          ║
     * ║   【       → 收回   收回最后揭示的挖空                       ║
     * ╠══════════════════════════════════════════════════════════════╣
     * ║ 手柄按键（Gamepad API，Xbox/PS 通用布局）                    ║
     * ║   B / ○ (Button 1)  → 翻牌（显示答案）                      ║
     * ║   LB / L1 (Button 4)→ 【收回最后揭示的挖空                  ║
     * ║   RB / R1 (Button 5)→ 】揭示下一个挖空                      ║
     * ║   LT / L2 (Button 6)→ 展开/折叠节点                         ║
     * ║   RT / R2 (Button 7)→ 显/隐 cloze 答案                      ║
     * ║   L3 (Button 10)    → 定位到当前挖空                        ║
     * ║   R3 (Button 11)    → 色系切换                              ║
     * ║   左摇杆 Y 轴       → 上下滚动页面                           ║
     * ║   右摇杆 Y 轴       → 页面缩放（上拨放大 / 下拨缩小）        ║
     * ╚══════════════════════════════════════════════════════════════╝
     */
    (function () {
      'use strict';

      /* ══════════════════════════════════════════════════════════════
       * 监听器注册机制
       * ──────────────────────────────────────────────────────────────
       * Anki 新版在翻牌时不完整重载页面，正面注册的监听器在背面仍然
       * 存活。若直接再次注册同一个 handler，每次按键会触发两遍（如
       * tick() 展开后立刻折叠，视觉上没有反应）。
       * 解决方案：翻牌/重载前先移除上一轮注册的所有监听器，再重新注册。
       * ══════════════════════════════════════════════════════════════ */
      if (typeof window.ankiShortcutListeners !== 'undefined') {
        for (var i = 0; i < window.ankiShortcutListeners.length; i++) {
          document.removeEventListener(
            window.ankiShortcutListeners[i][0],
            window.ankiShortcutListeners[i][1],
            window.ankiShortcutListeners[i][2] === true
          );
        }
      }
      window.ankiShortcutListeners = [];

      var shortcutRoot = document.querySelector('.linkRender');
      function addListener(type, handler) {
        /* 使用 capture=true，尽量在 Anki 原生快捷键之前截获事件 */
        var useCapture = true;
        var scopedHandler = function (event) {
          if (shortcutRoot && shortcutRoot.isConnected) handler(event);
        };
        document.addEventListener(type, scopedHandler, useCapture);
        window.ankiShortcutListeners.push([type, scopedHandler, useCapture]);
      }

      /* ── 工具：展开/折叠全部节点（智能切换） ── */
      function toggleExpandCollapse() {
        var anyCollapsed = false;
        document.querySelectorAll('.bullet').forEach(function (bullet) {
          var ch = bullet.parentElement && bullet.parentElement.querySelector('.children');
          if (ch && ch.style.display === 'none') anyCollapsed = true;
        });
        var btn = anyCollapsed
          ? document.getElementById('xian')
          : document.getElementById('yin');
        if (btn) btn.click();
      }

      /* ── 工具：切换弹窗 ──
         优先读取 inline style（与原按钮逻辑一致）：
         空字符串 '' 或 'none' 均视为隐藏；否则视为已显示。
         这样可兼容 CSS hidden（#popup）和 inline hidden（#popup2）两种写法。 */
      function triggerPopup(popupId) {
        var popup = document.getElementById(popupId);
        if (!popup) return;
        var shown = popup.style.display !== '' && popup.style.display !== 'none';
        popup.style.display = shown ? 'none' : 'block';
      }

      /* ── 工具：揭示下一个挖空（】键） ──
         按 DOM 顺序找到第一个仍显示 [...] 的 .cloze，调用全局 toggle() 展开，
         然后滚动至视口 1/3 处，与 scrollToElement 保持一致的视觉体验。 */
      function revealNextCloze() {
        var clozes = document.querySelectorAll('span.cloze');
        for (var i = 0; i < clozes.length; i++) {
          if (clozes[i].querySelector('.cloze-placeholder')) {
            if (typeof toggle === 'function') toggle(clozes[i]);
            var top = clozes[i].getBoundingClientRect().top
              + (window.scrollY || window.pageYOffset)
              - window.innerHeight / 3;
            window.scrollTo({ top: top, behavior: 'smooth' });
            break;
          }
        }
      }

      /* ── 工具：收回最后揭示的挖空（【键） ──
         按 DOM 逆序找到最后一个已展开的 .cloze，调用 toggle() 重新隐藏。 */
      function hideLastCloze() {
        var clozes = document.querySelectorAll('span.cloze');
        for (var i = clozes.length - 1; i >= 0; i--) {
          if (!clozes[i].querySelector('.cloze-placeholder')) {
            if (typeof toggle === 'function') toggle(clozes[i]);
            var top = clozes[i].getBoundingClientRect().top
              + (window.scrollY || window.pageYOffset)
              - window.innerHeight / 3;
            window.scrollTo({ top: top, behavior: 'smooth' });
            break;
          }
        }
      }

      /* ── 工具：打开搜索并可选聚焦 ── */
      function openSearch(focusInput) {
        var box = document.getElementById('searchBox');
        if (box) { box.style.visibility = 'visible'; box.style.height = 'auto'; }
        if (focusInput) {
          var inp = document.getElementById('search');
          if (inp) { inp.focus(); inp.select(); }
        }
      }

      /* ── 工具：关闭搜索 ── */
      function closeSearch() {
        var box = document.getElementById('searchBox');
        if (box) { box.style.visibility = 'hidden'; box.style.height = '0'; }
      }

      /* ══════════════════════════════════════════════════════════════
       * 键盘快捷键
       * ──────────────────────────────────────────────────────────────
       * 使用 event.code（物理键位）而非 event.key：
       *   · event.key 在中文输入法激活时可能返回 'Process' 或汉字
       *   · event.code 始终反映按键物理位置，不受输入法影响
       * ══════════════════════════════════════════════════════════════ */
      /* ── G 键专用 keyup 监听器 ──
         经调试确认：Anki/Qt 原生快捷键系统会在 WebView 获得事件之前
         消耗掉 G 键的 keydown，导致 JavaScript 完全收不到 KeyG keydown。
         但 keyup 不受 Qt 快捷键系统影响，可正常到达 JavaScript，
         因此 G 改用 keyup 事件触发，其余键保持 keydown 不变。 */
      addListener('keyup', function (e) {
        var tag = document.activeElement ? document.activeElement.tagName : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.code === 'KeyG') {
          triggerPopup('popup');
          e.preventDefault();
          e.stopPropagation();
        }
      });

      addListener('keydown', function (e) {
        var handled = false;
        /* Ctrl/Cmd + F：打开搜索并聚焦（任何焦点状态下生效） */
        if ((e.ctrlKey || e.metaKey) && e.code === 'KeyF') {
          handled = true;
          openSearch(true);
          e.preventDefault();
          e.stopPropagation();
          return;
        }

        /* Escape：关闭搜索菜单并取消输入框焦点。
           必须放在输入框检查之前，否则搜索框展开+输入框获焦时
           Escape 会被 INPUT 检查提前 return 掉，永远无法关闭菜单。 */
        if (e.code === 'Escape') {
          handled = true;
          closeSearch();
          if (document.activeElement) document.activeElement.blur();
          e.preventDefault();
          e.stopPropagation();
          return;
        }

        /* 输入框内除上述两条之外的单键全部静默 */
        var tag = document.activeElement ? document.activeElement.tagName : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;

        /* 单键快捷键：用 e.code 精确匹配物理键位 */
        switch (e.code) {
          /* ── 左侧 2 按钮：home 行 G-H ── */
          case 'KeyH': /* 定位到当前挖空（左侧底部） */
            handled = true;
            if (typeof scrollToElement === 'function') scrollToElement(); break;
          /* ── 右侧 3 按钮：home 行 J-K-L ── */
          case 'KeyJ': /* 导图浮窗（右侧顶部） */
            handled = true;
            triggerPopup('popup2'); break;
          case 'KeyK': /* 展开 / 折叠 节点（右侧中部） */
            handled = true;
            toggleExpandCollapse(); break;
          case 'KeyL': /* 显/隐 cloze 答案（右侧底部） */
            handled = true;
            if (typeof tick === 'function') tick(); break;
          /* F 键与 Anki 原生 Flag 快捷键冲突，已移除；请用 Ctrl+F 开启搜索 */
          case 'KeyC': /* 色系切换 */
            handled = true;
            if (typeof toggleTheme === 'function') toggleTheme(); break;
          /* ── 挖空逐步揭示 ── */
          case 'BracketRight': /* 】揭示下一个挖空 */
            handled = true;
            revealNextCloze(); break;
          case 'BracketLeft':  /* 【收回最后揭示的挖空 */
            handled = true;
            hideLastCloze(); break;
        }
        if (handled) {
          e.preventDefault();
          e.stopPropagation();
        }
      });

      /* ══════════════════════════════════════════════════════════════
       * 手柄支持（Gamepad API 轮询，边沿检测 + 300ms 防抖）
       * ══════════════════════════════════════════════════════════════ */
      if (typeof navigator === 'undefined' || !navigator.getGamepads) return;

      /* ── 工具：翻牌（正面专用）──
         先将本侧循环标记为停止（gamepadShouldStop），再触发翻牌。
         这样即使 click() 同步执行导致背面 IIFE 立刻运行，
         pollGamepad 函数体在 click() 返回后也不会再调度下一帧，
         避免前后两个轮询循环同时存活、互相抵消。 */
      function triggerSpace() {
        gamepadShouldStop = true;
        var btn = document.querySelector(
          '#anki-flip, .flipButton, #flip, [onclick*="pycmd"][onclick*="ans"]'
        );
        if (btn) { btn.click(); return; }
        setTimeout(function () { try { pycmd('ans'); } catch (e) {} }, 0);
      }

      var GP_DEBOUNCE_MS = 300;
      var gpLastFire = {};
      var gpWasPressed = {};
      /* 停止标志：triggerSpace 触发翻牌前置为 true，让 pollGamepad 不再调度下一帧 */
      var gamepadShouldStop = false;

      /* ── 手柄按键映射（正面）──
         Button 1  B / ○   → 翻牌（显示答案）
         Button 4  LB / L1 → 【收回最后揭示的挖空
         Button 5  RB / R1 → 】揭示下一个挖空
        Button 6  LT / L2 → 展开 / 折叠节点
        Button 7  RT / R2 → 显 / 隐 cloze 答案
         Button 10 L3      → 定位到当前挖空
         Button 11 R3      → 色系切换
         左摇杆 Y 轴       → 上下滚动页面（比例速度，含死区）
         右摇杆 Y 轴       → 页面缩放（上拨放大，下拨缩小） */
      var gpMap = {
        1:  function () { triggerSpace(); },
        4:  function () { hideLastCloze(); },
        5:  function () { revealNextCloze(); },
        6:  function () { toggleExpandCollapse(); },
        7:  function () { if (typeof tick === 'function') tick(); },
        10: function () { if (typeof scrollToElement === 'function') scrollToElement(); },
        11: function () { if (typeof toggleTheme === 'function') toggleTheme(); }
      };

      /* 取消上一轮轮询（翻牌时旧循环仍在运行，不取消会双重触发） */
      if (typeof window.ankiGamepadPollId !== 'undefined') {
        cancelAnimationFrame(window.ankiGamepadPollId);
      }

      /* 摇杆参数 */
      var STICK_DEADZONE   = 0.25; /* 死区：偏移量低于此值时忽略 */
      var STICK_SCROLL_SPD = 10;   /* 左摇杆：每帧最大滚动像素（满偏） */
      var ZOOM_SPEED       = 0.005;/* 右摇杆：每帧最大缩放步长（满偏） */
      var ZOOM_MIN         = 0.3;  /* 最小缩放比例 */
      var ZOOM_MAX         = 3.0;  /* 最大缩放比例 */

      function pollGamepad() {
        /* 若本侧已触发翻牌，停止调度，让背面接管 */
        if (gamepadShouldStop || !shortcutRoot || !shortcutRoot.isConnected) return;
        var gamepads = navigator.getGamepads();
        for (var gi = 0; gi < gamepads.length; gi++) {
          var gp = gamepads[gi];
          if (!gp) continue;

          /* ── 按钮事件（边沿检测 + 防抖） ── */
          for (var idx in gpMap) {
            var btn = gp.buttons[idx];
            var pressed = btn && (btn.pressed || btn.value > 0.5);
            var now = Date.now();
            if (pressed && !gpWasPressed[idx] &&
                (now - (gpLastFire[idx] || 0)) >= GP_DEBOUNCE_MS) {
              gpMap[idx]();
              gpLastFire[idx] = now;
            }
            gpWasPressed[idx] = pressed;
          }

          if (gp.axes) {
            /* ── 左摇杆 Y 轴（axes[1]）→ 滚动页面：-1=上，+1=下 ── */
            if (gp.axes.length > 1 && Math.abs(gp.axes[1]) > STICK_DEADZONE) {
              window.scrollBy(0, gp.axes[1] * STICK_SCROLL_SPD);
            }

            /* ── 右摇杆 Y 轴（axes[3]）→ 缩放页面：-1=上=放大，+1=下=缩小 ── */
            if (gp.axes.length > 3 && Math.abs(gp.axes[3]) > STICK_DEADZONE) {
              /* 从 body.style.zoom 读取当前值；初次未设置时默认 1 */
              var curZoom = parseFloat(document.body.style.zoom) || 1;
              /* 上拨（负值）→ 放大；下拨（正值）→ 缩小 */
              var newZoom = curZoom - gp.axes[3] * ZOOM_SPEED;
              newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
              document.body.style.zoom = newZoom;
            }
          }
        }
        window.ankiGamepadPollId = requestAnimationFrame(pollGamepad);
      }

      /* 预填当前按钮状态：防止翻牌时仍按住的按钮在新循环启动后立刻重触发 */
      var _initGps = navigator.getGamepads();
      for (var _ig = 0; _ig < _initGps.length; _ig++) {
        if (!_initGps[_ig]) continue;
        _initGps[_ig].buttons.forEach(function (b, idx) {
          if (b && (b.pressed || b.value > 0.5)) gpWasPressed[idx] = true;
        });
      }

    window.ankiGamepadPollId = requestAnimationFrame(pollGamepad);
  })();
  </script>
